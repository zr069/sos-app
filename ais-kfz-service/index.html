<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AIS Kfz — Oberursel</title>
<meta name="description" content="AIS Kfz, Oberursel (Taunus). Diese Website wird derzeit überarbeitet." />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#0B0C0E" />
<link rel="icon" href="assets/logo.jpg" />
<link rel="stylesheet" href="assets/fonts/fonts.css" />
<style>
  :root { --ink:#0B0C0E; --card:#16181E; --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.16);
    --gold:#CDA45C; --gold-bright:#E6C588; --txt:#F3F1EA; --muted:#A2A39E; --faint:#6E7077; }
  * { box-sizing:border-box; margin:0; }
  html,body { height:100%; }
  body { background:var(--ink); color:var(--txt); font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    line-height:1.6; -webkit-font-smoothing:antialiased; display:flex; flex-direction:column; min-height:100dvh; }
  a { color:inherit; }
  main { flex:1; display:flex; align-items:center; justify-content:center; padding:40px 22px; }
  .card { width:100%; max-width:520px; text-align:center;
    background:linear-gradient(180deg, rgba(255,255,255,.02), transparent);
    border:1px solid var(--line); border-radius:22px; padding:clamp(30px,6vw,52px) clamp(24px,5vw,44px); }
  .logo { width:88px; height:88px; border-radius:20px; object-fit:cover; border:1px solid rgba(205,164,92,.35);
    box-shadow:0 8px 30px -12px rgba(0,0,0,.8); margin:0 auto 22px; display:block; }
  h1 { font-family:"Sora",sans-serif; font-weight:700; font-size:1.9rem; letter-spacing:-.01em; }
  .status { color:var(--muted); font-size:1.02rem; margin:14px auto 0; max-width:34ch; }
  .rule { height:1px; background:var(--line); margin:30px 0; }
  .kontakt-label { font-family:"Sora",sans-serif; font-size:.74rem; font-weight:600; letter-spacing:.18em;
    text-transform:uppercase; color:var(--gold); margin-bottom:14px; }
  address { font-style:normal; color:var(--txt); font-size:1.02rem; line-height:1.85; }
  address .muted { color:var(--muted); }
  address a { color:var(--gold-bright); text-decoration:none; }
  address a:hover { text-decoration:underline; text-underline-offset:2px; }
  .contact-actions { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-top:22px; }
  .btn { display:inline-flex; align-items:center; gap:8px; font-family:"Sora",sans-serif; font-weight:600;
    font-size:.95rem; padding:13px 22px; border-radius:999px; text-decoration:none; transition:transform .15s, box-shadow .2s, background .2s, border-color .2s; }
  .btn--gold { background:linear-gradient(180deg,var(--gold-bright),var(--gold) 60%,#A57F3C); color:#1A1407;
    box-shadow:0 14px 40px -16px rgba(205,164,92,.5); }
  .btn--gold:hover { transform:translateY(-2px); }
  .btn--ghost { border:1px solid var(--line2); color:var(--txt); }
  .btn--ghost:hover { border-color:rgba(205,164,92,.4); transform:translateY(-2px); }
  footer { padding:22px; text-align:center; border-top:1px solid var(--line); }
  footer p { color:var(--faint); font-size:.82rem; margin-bottom:8px; }
  footer nav { display:flex; gap:18px; justify-content:center; }
  footer nav a { color:var(--muted); font-size:.82rem; text-decoration:none; }
  footer nav a:hover { color:var(--gold-bright); }
</style>
</head>
<body>
  <main>
    <div class="card">
      <img class="logo" src="assets/logo.jpg" alt="AIS Kfz" width="88" height="88" />
      <h1>AIS Kfz</h1>
      <p class="status">Unsere Website wird derzeit überarbeitet. Sie erreichen uns gerne direkt:</p>

      <div class="rule"></div>

      <p class="kontakt-label">Kontakt</p>
      <address>
        Ivan Antonenko<br />
        <span class="muted">Oberurseler Straße 81, 61440 Oberursel (Taunus)</span><br />
        <a href="tel:+491637963915">+49 163 7963915</a><br />
        <a href="mailto:info@ais-kfz.de">info@ais-kfz.de</a>
      </address>

      <div class="contact-actions">
        <a class="btn btn--gold" href="tel:+491637963915">Anrufen</a>
        <a class="btn btn--ghost" href="mailto:info@ais-kfz.de">E-Mail schreiben</a>
      </div>
    </div>
  </main>

  <footer>
    <p>© <span id="year">2026</span> AIS Kfz · Oberursel (Taunus)</p>
    <nav aria-label="Rechtliches">
      <a href="impressum.html">Impressum</a>
      <a href="datenschutz.html">Datenschutz</a>
    </nav>
  </footer>

  <script>document.getElementById("year").textContent = new Date().getFullYear();</script>
</body>
</html>
